name: CI

# Validación de Pull Requests.
# Corre en un runner efímero de GitHub, NUNCA en el runner self-hosted:
# el código de un PR no debe ejecutarse en el servidor de producción.
on:
    pull_request:
        branches: ["main"]

permissions:
    contents: read

jobs:
    build:
        name: Compilar
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Configurar Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: "npm"

            - name: Instalar dependencias
              run: npm ci

            - name: Compilar TypeScript
              run: npm run build
